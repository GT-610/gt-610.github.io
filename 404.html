<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>页面已迁移</title>
  <script>
    // Get current path
    const path = window.location.pathname;
    // Build new URL
    const newUrl = "https://gt610.dpdns.org" + path;

    document.addEventListener("DOMContentLoaded", function () {
      const linkElement = document.getElementById("new-link");
      linkElement.href = newUrl;
      linkElement.textContent = newUrl;
      // 新增：显示原访问路径
      document.getElementById("original-path").textContent = path;
    });
  </script>
  <!-- 添加与index.html一致的内联样式 -->
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .content {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 25px;
      font-size: 2.2rem;
      font-weight: 600;
    }
    p {
      color: #34495e;
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    a {
      color: #3498db;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      border-bottom: 2px solid transparent;
      padding-bottom: 2px;
    }
    a:hover {
      color: #2980b9;
      border-bottom: 2px solid #2980b9;
    }
  </style>
</head>
<body>
  <!-- 使用内容容器包裹，样式与index.html一致 -->
  <div class="content">
    <h1>该页面已迁移至新站点</h1>
    <p>您尝试访问的页面：</p>
    <p><span id="original-path"></span></p>
    <p>现已迁移至：</p>
    <p><a id="new-link" href="#">https://your-new-site.com/...</a></p>
  </div>
</body>
</html>
